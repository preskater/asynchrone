apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "asynchrone-space-employees.fullname" . }}-test-connection"
  labels:
    {{- include "asynchrone-space-employees.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: {{ .Values.tests.image }}
      command:
        - wget
        - -qO-
        - "http://{{ include "asynchrone-space-employees.fullname" . }}:{{ .Values.service.port }}/"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
