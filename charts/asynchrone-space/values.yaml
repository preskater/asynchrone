# Production values for the Asynchrone Space umbrella chart.
#
# Secrets are never stored here. Create the three Secrets first:
#
#   asynchrone-space-copilot-secrets:           DATABASE_URL, BETTER_AUTH_SECRET, CRON_SECRET,
#                                           optional OPENAI_API_KEY, RESEND_API_KEY,
#                                           GITHUB_CLIENT_SECRET, GITLAB_CLIENT_SECRET
#   asynchrone-space-projects-secrets:      DATABASE_URL (the same database as
#                                           Copilot until #190), PROJECTS_OAUTH_CLIENT_ID,
#                                           PROJECTS_OAUTH_CLIENT_SECRET
#   asynchrone-space-messages-secrets:      DATABASE_URL (the same database as
#                                           Copilot until #190/#171),
#                                           MESSAGES_OAUTH_CLIENT_ID,
#                                           MESSAGES_OAUTH_CLIENT_SECRET
#   asynchrone-space-control-tower-secrets: DATABASE_URL, CONTROL_TOWER_BETTER_AUTH_SECRET
#
# Install with an immutable image tag shared by all images:
#   helm dependency build charts/asynchrone-space
#   helm upgrade --install asynchrone-space charts/asynchrone-space -n asynchrone-space --create-namespace \
#     --set global.imageTag=sha-abc1234

global:
  # Required. Use the immutable tag produced by the Docker workflow for a
  # commit (for example `sha-abc1234`) rather than a branch name.
  imageTag: ""
  imagePullSecrets: []

# ---------------------------------------------------------------------------
# Public marketing site (no database, no session)
# ---------------------------------------------------------------------------
asynchrone-space-landing:
  enabled: true

  # Release `asynchrone-space` yields the resources `asynchrone-space-landing-*`.
  nameOverride: landing
  image:
    repository: ghcr.io/preskater/asynchrone-space-landing
    tag: ""
    pullPolicy: IfNotPresent

  replicaCount: 2

  ingress:
    enabled: true
    className: nginx
    annotations:
      # www.asynchrone.space -> asynchrone.space at the edge.
      nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
    hosts:
      - host: asynchrone.space
        paths:
          - path: /
            pathType: Prefix
    tls: []
      # - secretName: asynchrone-space-tls
      #   hosts:
      #     - asynchrone.space
      #     - www.asynchrone.space

# ---------------------------------------------------------------------------
# Customer-facing app (the workspace shell until #175 moves it to Copilot)
# ---------------------------------------------------------------------------
asynchrone-space-copilot:
  enabled: true

  # Release `asynchrone-space` yields the resources `asynchrone-space-copilot-*`.
  nameOverride: copilot
  image:
    repository: ghcr.io/preskater/asynchrone-space-copilot
    tag: ""
    pullPolicy: IfNotPresent

  replicaCount: 2

  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "8m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    hosts:
      - host: copilot.asynchrone.space
        paths:
          - path: /
            pathType: Prefix
    tls: []
      # - secretName: copilot-asynchrone-space-tls
      #   hosts:
      #     - copilot.asynchrone.space

  config:
    BETTER_AUTH_URL: https://copilot.asynchrone.space
    NEXT_PUBLIC_APP_URL: https://copilot.asynchrone.space
    COPILOT_APP_URL: https://copilot.asynchrone.space
    PROJECTS_APP_URL: https://projects.copilot.asynchrone.space
    MESSAGES_APP_URL: https://messages.copilot.asynchrone.space
    CONTROL_TOWER_URL: https://control-tower.asynchrone.space
    # Keep replicas x DATABASE_POOL_MAX below the database connection limit.
    DATABASE_POOL_MAX: "10"
    MCP_RESOURCE_URL: https://copilot.asynchrone.space/mcp
    OPENAI_API_URL: ""
    ASSISTANT_MODEL: gpt-4o-mini
    EMAIL_FROM: ""
    REQUIRE_EMAIL_VERIFICATION: "false"
    GITHUB_CLIENT_ID: ""
    GITLAB_CLIENT_ID: ""
    # Pair with TURNSTILE_SECRET_KEY in asynchrone-space-copilot-secrets.
    TURNSTILE_SITE_KEY: ""
    SIGNUP_INVITE_ONLY: "false"
    SIGNUP_BLOCKED_EMAIL_DOMAINS: ""
    # Headers a proxy overwrites; never expose the pods without the ingress.
    TRUSTED_IP_HEADERS: "x-real-ip,x-forwarded-for"
    # Pair with STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET in the Secret.
    STRIPE_PRICE_TEAM_MONTHLY: ""
    STRIPE_PRICE_TEAM_YEARLY: ""
    STRIPE_AUTOMATIC_TAX: ""
    NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ""

  secret:
    existingSecret: asynchrone-space-copilot-secrets

  # Replace the former Vercel crons.
  cronjobs:
    image: curlimages/curl:8.16.0
    secretName: ""
    uploadsSweep:
      enabled: true
      schedule: "0 3 * * *"
      path: /api/files/uploads/sweep
    repositorySync:
      enabled: true
      schedule: "0 * * * *"
      path: /api/cron/repository-sync
    trialExpiry:
      enabled: true
      schedule: "0 6 * * *"
      path: /api/cron/trial-expiry
    organizationDeletion:
      enabled: true
      schedule: "30 3 * * *"
      path: /api/cron/organization-deletion
    auditRetention:
      enabled: true
      schedule: "45 3 * * *"
      path: /api/cron/audit-retention
    dataExports:
      enabled: true
      schedule: "*/15 * * * *"
      path: /api/cron/data-exports

# ---------------------------------------------------------------------------
# Domain app: projects (#160). Own image, own chart, host-only OIDC session.
# ---------------------------------------------------------------------------
asynchrone-space-projects:
  enabled: true

  # Release `asynchrone-space` yields the resources `asynchrone-space-projects-*`.
  nameOverride: projects
  image:
    repository: ghcr.io/preskater/asynchrone-space-projects
    tag: ""
    pullPolicy: IfNotPresent

  replicaCount: 2

  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: projects.copilot.asynchrone.space
        paths:
          - path: /
            pathType: Prefix
    tls: []
      # - secretName: projects-copilot-asynchrone-space-tls
      #   hosts:
      #     - projects.copilot.asynchrone.space

  config:
    PROJECTS_APP_URL: https://projects.copilot.asynchrone.space
    COPILOT_APP_URL: https://copilot.asynchrone.space
    DATABASE_POOL_MAX: "10"
    TRUSTED_IP_HEADERS: "x-real-ip,x-forwarded-for"
    DEPLOY_ENV: production

  secret:
    existingSecret: asynchrone-space-projects-secrets

# ---------------------------------------------------------------------------
# Domain app: messages (#162). Own image, own chart, host-only OIDC session.
# ---------------------------------------------------------------------------
asynchrone-space-messages:
  enabled: true

  # Release `asynchrone-space` yields the resources `asynchrone-space-messages-*`.
  nameOverride: messages
  image:
    repository: ghcr.io/preskater/asynchrone-space-messages
    tag: ""
    pullPolicy: IfNotPresent

  replicaCount: 2

  ingress:
    enabled: true
    className: nginx
    annotations:
      # Attachment chunks are posted to the app; keep the same 8 MB ceiling as
      # Copilot so a chunk of the files upload client always fits.
      nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    hosts:
      - host: messages.copilot.asynchrone.space
        paths:
          - path: /
            pathType: Prefix
    tls: []
      # - secretName: messages-copilot-asynchrone-space-tls
      #   hosts:
      #     - messages.copilot.asynchrone.space

  config:
    MESSAGES_APP_URL: https://messages.copilot.asynchrone.space
    COPILOT_APP_URL: https://copilot.asynchrone.space
    DATABASE_POOL_MAX: "10"
    TRUSTED_IP_HEADERS: "x-real-ip,x-forwarded-for"
    DEPLOY_ENV: production

  secret:
    existingSecret: asynchrone-space-messages-secrets

# ---------------------------------------------------------------------------
# Internal control tower
# ---------------------------------------------------------------------------
asynchrone-space-control-tower:
  enabled: true

  # Release `asynchrone-space` yields the resources `asynchrone-space-control-tower-*`.
  nameOverride: control-tower
  image:
    repository: ghcr.io/preskater/asynchrone-space-control-tower
    tag: ""
    pullPolicy: IfNotPresent

  replicaCount: 2

  ingress:
    enabled: true
    className: nginx
    annotations: {}
      # Restrict at the edge as defense in depth. The app also enforces
      # PLATFORM_ALLOWED_IPS against X-Forwarded-For / X-Real-IP.
      # nginx.ingress.kubernetes.io/whitelist-source-range: "203.0.113.0/24"
    hosts:
      - host: control-tower.asynchrone.space
        paths:
          - path: /
            pathType: Prefix
    tls: []
      # - secretName: control-tower-asynchrone-space-tls
      #   hosts:
      #     - control-tower.asynchrone.space

  config:
    BETTER_AUTH_URL: https://control-tower.asynchrone.space
    PLATFORM_APP_URL: https://copilot.asynchrone.space
    PLATFORM_ALLOWED_IPS: ""
    DATABASE_POOL_MAX: "10"
    DEPLOY_ENV: production

  secret:
    existingSecret: asynchrone-space-control-tower-secrets

# ---------------------------------------------------------------------------
# One-shot Prisma migrations, run as a pre-install/pre-upgrade hook before
# either Deployment is rolled out.
# ---------------------------------------------------------------------------
migrate:
  enabled: true
  # The referenced secret must contain DATABASE_URL (the monolith, until #185)
  # and IDENTITY_DATABASE_URL, PROJECTS_DATABASE_URL, CALENDARS_DATABASE_URL,
  # FILES_DATABASE_URL, MESSAGES_DATABASE_URL, CLIENTS_DATABASE_URL,
  # EMPLOYEES_DATABASE_URL and CONTROL_TOWER_DATABASE_URL.
  image:
    repository: ghcr.io/preskater/asynchrone-space-migrate
    tag: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  # Defaults to asynchrone-space-copilot.secret.existingSecret when empty.
  existingSecret: ""
  secretKey: DATABASE_URL
  backoffLimit: 2
  activeDeadlineSeconds: 600
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault
  # The migrate image is a plain Prisma CLI image. It only needs its HOME
  # directory writable; if a future Prisma release writes elsewhere, override
  # readOnlyRootFilesystem or runAsUser here.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources: {}
  extraEnv: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
