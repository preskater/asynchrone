apiVersion: v2
name: asynchrone-space
description: Umbrella chart for the Asynchrone Space landing, Copilot, domain apps and control tower
type: application
version: 0.2.0
appVersion: "0.0.1"

# One generic chart, instantiated once per app with a dependency alias and an
# app-specific values block below. Resource names stay
# `asynchrone-space-<alias>` because every alias sets `nameOverride`.
dependencies:
  - name: asynchrone-space-app
    alias: landing
    version: 0.1.0
    repository: file://../asynchrone-space-app
    condition: landing.enabled
  - name: asynchrone-space-app
    alias: copilot
    version: 0.1.0
    repository: file://../asynchrone-space-app
    condition: copilot.enabled
  - name: asynchrone-space-app
    alias: projects
    version: 0.1.0
    repository: file://../asynchrone-space-app
    condition: projects.enabled
  - name: asynchrone-space-app
    alias: calendars
    version: 0.1.0
    repository: file://../asynchrone-space-app
    condition: calendars.enabled
  - name: asynchrone-space-app
    alias: files
    version: 0.1.0
    repository: file://../asynchrone-space-app
    condition: files.enabled
  - name: asynchrone-space-app
    alias: messages
    version: 0.1.0
    repository: file://../asynchrone-space-app
    condition: messages.enabled
  - name: asynchrone-space-app
    alias: clients
    version: 0.1.0
    repository: file://../asynchrone-space-app
    condition: clients.enabled
  - name: asynchrone-space-app
    alias: employees
    version: 0.1.0
    repository: file://../asynchrone-space-app
    condition: employees.enabled
  - name: asynchrone-space-app
    alias: control-tower
    version: 0.1.0
    repository: file://../asynchrone-space-app
    condition: control-tower.enabled
