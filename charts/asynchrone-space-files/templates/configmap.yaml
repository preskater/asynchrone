apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "asynchrone-space-files.fullname" . }}
  labels:
    {{- include "asynchrone-space-files.labels" . | nindent 4 }}
{{- with .Values.config }}
data:
  {{- range $key, $value := . }}
  {{- if ne (toString $value) "" }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
