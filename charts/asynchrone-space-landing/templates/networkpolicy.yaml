{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "asynchrone-space-landing.fullname" . }}
  labels:
    {{- include "asynchrone-space-landing.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "asynchrone-space-landing.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.containerPort }}
  egress:
    # DNS.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Optional HTTPS egress (Sentry and other browser-side providers).
    - to:
        {{- toYaml .Values.networkPolicy.egressFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: 443
{{- end }}
