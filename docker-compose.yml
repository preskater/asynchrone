# Dev-only defaults. Override POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
# from the shell or a repo-root .env (not apps/copilot/.env). Values are inlined
# into DATABASE_URL, so avoid URL-reserved characters (@ : / ?) in them.
networks:
  postgres-network:

volumes:
  postgres-data:

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asynchrone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asynchrone}
      POSTGRES_DB: ${POSTGRES_DB:-asynchrone}
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-app-databases.sql:ro
    networks:
      - postgres-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-asynchrone}"]
      interval: 10s
      timeout: 5s
      retries: 5

  copilot-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-asynchrone}:${POSTGRES_PASSWORD:-asynchrone}@postgres:5432/${POSTGRES_DB:-asynchrone}?schema=public
      - IDENTITY_DATABASE_URL=postgresql://${POSTGRES_USER:-asynchrone}:${POSTGRES_PASSWORD:-asynchrone}@postgres:5432/asynchrone_identity?schema=public
      - PROJECTS_DATABASE_URL=postgresql://${POSTGRES_USER:-asynchrone}:${POSTGRES_PASSWORD:-asynchrone}@postgres:5432/asynchrone_projects?schema=public
      - CALENDARS_DATABASE_URL=postgresql://${POSTGRES_USER:-asynchrone}:${POSTGRES_PASSWORD:-asynchrone}@postgres:5432/asynchrone_calendars?schema=public
      - FILES_DATABASE_URL=postgresql://${POSTGRES_USER:-asynchrone}:${POSTGRES_PASSWORD:-asynchrone}@postgres:5432/asynchrone_files?schema=public
      - MESSAGES_DATABASE_URL=postgresql://${POSTGRES_USER:-asynchrone}:${POSTGRES_PASSWORD:-asynchrone}@postgres:5432/asynchrone_messages?schema=public
      - CLIENTS_DATABASE_URL=postgresql://${POSTGRES_USER:-asynchrone}:${POSTGRES_PASSWORD:-asynchrone}@postgres:5432/asynchrone_clients?schema=public
      - EMPLOYEES_DATABASE_URL=postgresql://${POSTGRES_USER:-asynchrone}:${POSTGRES_PASSWORD:-asynchrone}@postgres:5432/asynchrone_employees?schema=public
      - CONTROL_TOWER_DATABASE_URL=postgresql://${POSTGRES_USER:-asynchrone}:${POSTGRES_PASSWORD:-asynchrone}@postgres:5432/asynchrone_control_tower?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - postgres-network
    restart: "no"

  landing:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: landing
        # The landing links account actions to Copilot; in compose it runs on
        # 3003.
        NEXT_PUBLIC_WORKSPACE_URL: http://localhost:3003
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=production
    networks:
      - postgres-network

  copilot:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3003:3000"
    # Load the app's .env so local `next dev` and this container share the same
    # BETTER_AUTH_SECRET: the JWKS signing keys stored in the database are
    # encrypted with it, and a different secret breaks MCP/OAuth token
    # issuance ("Failed to decrypt private key"). The `environment` block
    # below still overrides the container-specific values.
    env_file:
      - path: apps/copilot/.env
        required: false
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-asynchrone}:${POSTGRES_PASSWORD:-asynchrone}@postgres:5432/${POSTGRES_DB:-asynchrone}?schema=public
      # Copilot owns the identity database; the container reaches PostgreSQL
      # through the compose network, not localhost.
      - IDENTITY_DATABASE_URL=postgresql://${POSTGRES_USER:-asynchrone}:${POSTGRES_PASSWORD:-asynchrone}@postgres:5432/asynchrone_identity?schema=public
      - BETTER_AUTH_URL=http://localhost:3003
      - COPILOT_APP_URL=http://localhost:3003
      - PROJECTS_APP_URL=http://localhost:3004
      - CALENDARS_APP_URL=http://localhost:3005
      - FILES_APP_URL=http://localhost:3006
      - MESSAGES_APP_URL=http://localhost:3007
      - CLIENTS_APP_URL=http://localhost:3008
      - EMPLOYEES_APP_URL=http://localhost:3009
      - MCP_RESOURCE_URL=http://localhost:3003/mcp
      - CONTROL_TOWER_URL=http://localhost:3001
    depends_on:
      postgres:
        condition: service_healthy
      copilot-migrate:
        condition: service_completed_successfully
    networks:
      - postgres-network

  # The first domain app (#160): its own image, chart and asynchrone_projects
  # database; identity reads go through Copilot's internal API (#171).
  projects:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: projects
    ports:
      - "3004:3000"
    # Own env file: the provisioned PROJECTS_OAUTH_CLIENT_* credentials and the
    # audit/trusted header settings.
    env_file:
      - path: apps/projects/.env
        required: false
    environment:
      - NODE_ENV=production
      - PROJECTS_DATABASE_URL=postgresql://${POSTGRES_USER:-asynchrone}:${POSTGRES_PASSWORD:-asynchrone}@postgres:5432/asynchrone_projects?schema=public
      - PROJECTS_APP_URL=http://localhost:3004
      - COPILOT_APP_URL=http://localhost:3003
    depends_on:
      postgres:
        condition: service_healthy
      copilot-migrate:
        condition: service_completed_successfully
    networks:
      - postgres-network

  # The messages domain app (#162): its own image, chart and asynchrone_messages
  # database, including attachment upload sessions and bytes (#171).
  messages:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: messages
    ports:
      - "3007:3000"
    # Own env file: the provisioned MESSAGES_OAUTH_CLIENT_* credentials and the
    # audit/trusted header settings.
    env_file:
      - path: apps/messages/.env
        required: false
    environment:
      - NODE_ENV=production
      - MESSAGES_DATABASE_URL=postgresql://${POSTGRES_USER:-asynchrone}:${POSTGRES_PASSWORD:-asynchrone}@postgres:5432/asynchrone_messages?schema=public
      - MESSAGES_APP_URL=http://localhost:3007
      - COPILOT_APP_URL=http://localhost:3003
    depends_on:
      postgres:
        condition: service_healthy
      copilot-migrate:
        condition: service_completed_successfully
    networks:
      - postgres-network

  # The files domain app (#161): its own image and chart. It owns the chunked
  # upload API, the download endpoint and the `uploads-sweep` CronJob.
  files:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: files
    ports:
      - "3006:3000"
    # Own env file: the provisioned FILES_OAUTH_CLIENT_* credentials, the
    # audit/trusted header settings and CRON_SECRET for the upload sweep.
    env_file:
      - path: apps/files/.env
        required: false
    environment:
      - NODE_ENV=production
      - FILES_DATABASE_URL=postgresql://${POSTGRES_USER:-asynchrone}:${POSTGRES_PASSWORD:-asynchrone}@postgres:5432/asynchrone_files?schema=public
      - FILES_APP_URL=http://localhost:3006
      - COPILOT_APP_URL=http://localhost:3003
    depends_on:
      postgres:
        condition: service_healthy
      copilot-migrate:
        condition: service_completed_successfully
    networks:
      - postgres-network

  # The calendars domain app (#161): calendar screens plus the meeting inbox and
  # meeting settings.
  calendars:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: calendars
    ports:
      - "3005:3000"
    env_file:
      - path: apps/calendars/.env
        required: false
    environment:
      - NODE_ENV=production
      - CALENDARS_DATABASE_URL=postgresql://${POSTGRES_USER:-asynchrone}:${POSTGRES_PASSWORD:-asynchrone}@postgres:5432/asynchrone_calendars?schema=public
      - CALENDARS_APP_URL=http://localhost:3005
      - COPILOT_APP_URL=http://localhost:3003
    depends_on:
      postgres:
        condition: service_healthy
      copilot-migrate:
        condition: service_completed_successfully
    networks:
      - postgres-network

  # CRM (#163): its own image and chart, same database client as Copilot until
  # #171/#190 move the remaining identity reads behind the internal APIs.
  clients:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: clients
    ports:
      - "3008:3000"
    env_file:
      - path: apps/clients/.env
        required: false
    environment:
      - NODE_ENV=production
      - CLIENTS_DATABASE_URL=postgresql://${POSTGRES_USER:-asynchrone}:${POSTGRES_PASSWORD:-asynchrone}@postgres:5432/asynchrone_clients?schema=public
      - CLIENTS_APP_URL=http://localhost:3008
      - COPILOT_APP_URL=http://localhost:3003
    depends_on:
      postgres:
        condition: service_healthy
      copilot-migrate:
        condition: service_completed_successfully
    networks:
      - postgres-network

  # HR (#163): its own image and chart. Salary and payroll stay behind
  # `requireAdmin` in the domain package.
  employees:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: employees
    ports:
      - "3009:3000"
    env_file:
      - path: apps/employees/.env
        required: false
    environment:
      - NODE_ENV=production
      - EMPLOYEES_DATABASE_URL=postgresql://${POSTGRES_USER:-asynchrone}:${POSTGRES_PASSWORD:-asynchrone}@postgres:5432/asynchrone_employees?schema=public
      - EMPLOYEES_APP_URL=http://localhost:3009
      - COPILOT_APP_URL=http://localhost:3003
    depends_on:
      postgres:
        condition: service_healthy
      copilot-migrate:
        condition: service_completed_successfully
    networks:
      - postgres-network

  control-tower:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: control-tower
    ports:
      - "3001:3000"
    # Same as `copilot`: reuse the control tower's own env file (secret, local
    # origins), then override the container-specific values below.
    # The control tower owns asynchrone_control_tower (ADR 0032); it is never
    # pointed at the customer database.
    env_file:
      - path: apps/control-tower/.env
        required: false
    environment:
      - NODE_ENV=production
      - CONTROL_TOWER_DATABASE_URL=postgresql://${POSTGRES_USER:-asynchrone}:${POSTGRES_PASSWORD:-asynchrone}@postgres:5432/asynchrone_control_tower?schema=public
      - BETTER_AUTH_URL=http://localhost:3001
      - PLATFORM_APP_URL=http://localhost:3003
    depends_on:
      postgres:
        condition: service_healthy
      copilot-migrate:
        condition: service_completed_successfully
    networks:
      - postgres-network
