      IDENTITY_DATABASE_URL: postgresql://asynchrone:asynchrone@localhost:5432/asynchrone_identity?schema=public
      PROJECTS_DATABASE_URL: postgresql://asynchrone:asynchrone@localhost:5432/asynchrone_projects?schema=public
      CALENDARS_DATABASE_URL: postgresql://asynchrone:asynchrone@localhost:5432/asynchrone_calendars?schema=public
      FILES_DATABASE_URL: postgresql://asynchrone:asynchrone@localhost:5432/asynchrone_files?schema=public
      MESSAGES_DATABASE_URL: postgresql://asynchrone:asynchrone@localhost:5432/asynchrone_messages?schema=public
      CLIENTS_DATABASE_URL: postgresql://asynchrone:asynchrone@localhost:5432/asynchrone_clients?schema=public
      EMPLOYEES_DATABASE_URL: postgresql://asynchrone:asynchrone@localhost:5432/asynchrone_employees?schema=public
      CONTROL_TOWER_DATABASE_URL: postgresql://asynchrone:asynchrone@localhost:5432/asynchrone_control_tower?schema=public
      BETTER_AUTH_SECRET: ci-projects-e2e-secret-placeholder-value
      # Both apps run from the suite's webServer config; these keep the
      # bootstrap and the server-side validation in agreement.
      BETTER_AUTH_URL: http://localhost:3010
      COPILOT_APP_URL: http://localhost:3010
      PROJECTS_APP_URL: http://localhost:3004
      PROJECTS_OAUTH_CLIENT_ID: asynchrone-projects
      PROJECTS_OAUTH_CLIENT_SECRET: e2e-projects-oauth-client-secret
      CONTROL_TOWER_URL: http://localhost:3001

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.10.0
