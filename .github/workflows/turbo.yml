      BETTER_AUTH_URL: http://localhost:3011
      COPILOT_APP_URL: http://localhost:3011
      MESSAGES_APP_URL: http://localhost:3007
      MESSAGES_OAUTH_CLIENT_ID: asynchrone-messages
      MESSAGES_OAUTH_CLIENT_SECRET: e2e-messages-oauth-client-secret
