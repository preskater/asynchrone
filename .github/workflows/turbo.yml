      EMPLOYEES_DATABASE_URL: postgresql://asynchrone:asynchrone@localhost:5432/asynchrone_employees?schema=public
      CONTROL_TOWER_DATABASE_URL: postgresql://asynchrone:asynchrone@localhost:5432/asynchrone_control_tower?schema=public
      BETTER_AUTH_SECRET: ci-employees-e2e-secret-placeholder-value
      BETTER_AUTH_URL: http://localhost:3010
      COPILOT_APP_URL: http://localhost:3010
      EMPLOYEES_APP_URL: http://localhost:3009
      EMPLOYEES_OAUTH_CLIENT_ID: asynchrone-employees
      EMPLOYEES_OAUTH_CLIENT_SECRET: e2e-employees-oauth-client-secret
      CONTROL_TOWER_URL: http://localhost:3001

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.10.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create per-app databases
        run: npm run db:create

      # The Copilot and employees builds below import the shared packages, so
      # every generated client they (or a shared package) needs must exist
      # before the build step runs.
      - name: Generate Prisma clients
        run: |
          npm run generate --workspace=@workspace/db
          npm run generate --workspace=@workspace/db-identity
          npm run generate --workspace=@workspace/db-projects
          npm run generate --workspace=@workspace/db-calendars
          npm run generate --workspace=@workspace/db-files
          npm run generate --workspace=@workspace/db-messages
          npm run generate --workspace=@workspace/db-clients
          npm run generate --workspace=@workspace/db-employees
          npm run generate --workspace=@workspace/db-control-tower

      - name: Apply monolith migrations
        run: npx prisma migrate deploy
        working-directory: packages/db

      - name: Apply per-app migrations
        run: npm run migrate:deploy

      # Playwright starts both apps with `next start` in CI (see the clients
      # job for the rationale).
      - name: Build Copilot and employees
        run: |
          npm run build --workspace=copilot
          npm run build --workspace=employees

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/employees

      - name: Employees e2e
        run: npm run test:e2e --workspace=employees
