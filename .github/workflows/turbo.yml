      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.10.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create per-app databases
        run: npm run db:create

      # The Copilot and clients builds below import the shared packages, so
      # every generated client they (or a shared package) needs must exist
      # before the build step runs.
      - name: Generate Prisma clients
        run: |
          npm run generate --workspace=@workspace/db
          npm run generate --workspace=@workspace/db-identity
          npm run generate --workspace=@workspace/db-projects
          npm run generate --workspace=@workspace/db-calendars
          npm run generate --workspace=@workspace/db-files
          npm run generate --workspace=@workspace/db-messages
          npm run generate --workspace=@workspace/db-clients
          npm run generate --workspace=@workspace/db-employees
          npm run generate --workspace=@workspace/db-control-tower

      - name: Apply monolith migrations
        run: npx prisma migrate deploy
        working-directory: packages/db

      - name: Apply per-app migrations
        run: npm run migrate:deploy

      # Playwright starts both apps with `next start` in CI; the dev server
      # compiles routes on demand and is less stable under the suite's parallel
      # sign-ins.
      - name: Build Copilot and clients
        run: |
          npm run build --workspace=copilot
          npm run build --workspace=clients

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/clients

      - name: Clients e2e
        run: npm run test:e2e --workspace=clients

  # The employees app (#163), same shape as the clients job. The suite pins the
  # payroll/admin authorization failures as well as sign-in and switching.
  e2e-employees:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: asynchrone
          POSTGRES_PASSWORD: asynchrone
          POSTGRES_DB: asynchrone
        ports:
