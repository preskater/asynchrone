      COPILOT_APP_URL: http://localhost:3010
      CALENDARS_APP_URL: http://localhost:3005
      CALENDARS_OAUTH_CLIENT_ID: asynchrone-calendars
      CALENDARS_OAUTH_CLIENT_SECRET: e2e-calendars-oauth-client-secret
      CONTROL_TOWER_URL: http://localhost:3001

    steps:
