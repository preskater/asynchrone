      CALENDARS_DATABASE_URL: postgresql://asynchrone:asynchrone@localhost:5432/asynchrone_calendars?schema=public
      FILES_DATABASE_URL: postgresql://asynchrone:asynchrone@localhost:5432/asynchrone_files?schema=public
      MESSAGES_DATABASE_URL: postgresql://asynchrone:asynchrone@localhost:5432/asynchrone_messages?schema=public
      CLIENTS_DATABASE_URL: postgresql://asynchrone:asynchrone@localhost:5432/asynchrone_clients?schema=public
      EMPLOYEES_DATABASE_URL: postgresql://asynchrone:asynchrone@localhost:5432/asynchrone_employees?schema=public
      CONTROL_TOWER_DATABASE_URL: postgresql://asynchrone:asynchrone@localhost:5432/asynchrone_control_tower?schema=public
