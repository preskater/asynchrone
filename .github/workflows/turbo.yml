name: Turbo CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      # Build-time placeholders. `prisma generate` loads prisma.config.ts,
      # which requires DATABASE_URL, and `next build` evaluates auth config.
      # Neither connects to the database during CI.
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      BETTER_AUTH_SECRET: ci-build-placeholder-secret-not-used-at-runtime
      BETTER_AUTH_URL: http://localhost:3000
      CONTROL_TOWER_DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      CONTROL_TOWER_BETTER_AUTH_SECRET: ci-control-tower-placeholder-secret-not-used
      PLATFORM_APP_URL: http://localhost:3000
      CONTROL_TOWER_URL: http://localhost:3001
      # The projects app validates its OAuth client at boot; the build only needs
      # non-empty placeholders (real values are injected at runtime).
      PROJECTS_APP_URL: http://localhost:3004
      COPILOT_APP_URL: http://localhost:3000
      PROJECTS_OAUTH_CLIENT_ID: ci-build-placeholder-client-id
      PROJECTS_OAUTH_CLIENT_SECRET: ci-build-placeholder-client-secret
      # Same for the messages app (#162): its OAuth client is validated at boot
      # and the build only needs non-empty placeholders.
      MESSAGES_APP_URL: http://localhost:3007
      MESSAGES_OAUTH_CLIENT_ID: ci-build-placeholder-client-id
      MESSAGES_OAUTH_CLIENT_SECRET: ci-build-placeholder-client-secret
      CALENDARS_APP_URL: http://localhost:3005
      CALENDARS_OAUTH_CLIENT_ID: ci-build-placeholder-client-id
      CALENDARS_OAUTH_CLIENT_SECRET: ci-build-placeholder-client-secret
      FILES_APP_URL: http://localhost:3006
      FILES_OAUTH_CLIENT_ID: ci-build-placeholder-client-id
      FILES_OAUTH_CLIENT_SECRET: ci-build-placeholder-client-secret
      # The clients and employees apps validate their OAuth client at boot.
      CLIENTS_APP_URL: http://localhost:3008
      EMPLOYEES_APP_URL: http://localhost:3009
      CLIENTS_OAUTH_CLIENT_ID: ci-build-placeholder-client-id
      CLIENTS_OAUTH_CLIENT_SECRET: ci-build-placeholder-client-secret
      EMPLOYEES_OAUTH_CLIENT_ID: ci-build-placeholder-client-id
      EMPLOYEES_OAUTH_CLIENT_SECRET: ci-build-placeholder-client-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.10.0
          cache: npm

      - name: Cache Turbo
        uses: actions/cache@v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('package-lock.json', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check workspace boundaries
        run: npm run check:boundaries

      - name: Validate OAuth client manifest
        run: npm run oauth:clients --workspace=copilot

      - name: Validate per-app Prisma schemas
        run: npm run verify:prisma-schemas

      - name: Build
        run: npm run build

      - name: Unit tests
        run: |
          npm run test:unit --workspace=copilot
          npm run test:unit --workspace=projects
          npm run test:unit --workspace=calendars
          npm run test:unit --workspace=files
          npm run test:unit --workspace=messages
          npm run test:unit --workspace=clients
          npm run test:unit --workspace=employees

  # Cross-domain contracts: package exports, member directory, notifications,
  # per-organization recents, search, export/deletion sagas and the
  # MCP/assistant tool surface. Needs a migrated database, never a browser.
  contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: asynchrone
          POSTGRES_PASSWORD: asynchrone
          POSTGRES_DB: asynchrone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asynchrone"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://asynchrone:asynchrone@localhost:5432/asynchrone?schema=public
      BETTER_AUTH_SECRET: ci-contracts-placeholder-secret-value
      BETTER_AUTH_URL: http://localhost:3000
      CONTROL_TOWER_URL: http://localhost:3001

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.10.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma clients
        run: |
          npm run generate --workspace=@workspace/db
          npm run generate --workspace=@workspace/db-identity

      - name: Apply monolith migrations
        run: npx prisma migrate deploy
        working-directory: packages/db

      - name: Cross-domain contracts
        run: npm run test:contracts --workspace=copilot

  # The landing must build with no database, no auth secret and no workspace
  # package, so it gets its own job with an empty environment.
  landing:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.10.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck landing
        run: npm run typecheck --workspace=landing

      - name: Lint landing
        run: npm run lint --workspace=landing

      - name: Verify landing is stateless
        run: npm run verify:stateless --workspace=landing

      - name: Unit tests
        run: npm run test:unit --workspace=landing

      - name: Build landing
        run: npm run build --workspace=landing

      - name: Legal copy parity
        run: npm run verify:legal-copy --workspace=landing

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: asynchrone
          POSTGRES_PASSWORD: asynchrone
          POSTGRES_DB: asynchrone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asynchrone"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://asynchrone:asynchrone@localhost:5432/asynchrone?schema=public
      IDENTITY_DATABASE_URL: postgresql://asynchrone:asynchrone@localhost:5432/asynchrone_identity?schema=public
      PROJECTS_DATABASE_URL: postgresql://asynchrone:asynchrone@localhost:5432/asynchrone_projects?schema=public
      CALENDARS_DATABASE_URL: postgresql://asynchrone:asynchrone@localhost:5432/asynchrone_calendars?schema=public
      FILES_DATABASE_URL: postgresql://asynchrone:asynchrone@localhost:5432/asynchrone_files?schema=public
      MESSAGES_DATABASE_URL: postgresql://asynchrone:asynchrone@localhost:5432/asynchrone_messages?schema=public
      CLIENTS_DATABASE_URL: postgresql://asynchrone:asynchrone@localhost:5432/asynchrone_clients?schema=public
      EMPLOYEES_DATABASE_URL: postgresql://asynchrone:asynchrone@localhost:5432/asynchrone_employees?schema=public
      CONTROL_TOWER_DATABASE_URL: postgresql://asynchrone:asynchrone@localhost:5432/asynchrone_control_tower?schema=public
      BETTER_AUTH_SECRET: ci-e2e-secret-placeholder-value
      BETTER_AUTH_URL: http://localhost:3000
      CONTROL_TOWER_BETTER_AUTH_SECRET: ci-control-tower-placeholder-secret-not-used
      PLATFORM_APP_URL: http://localhost:3000
      CONTROL_TOWER_URL: http://localhost:3001

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.10.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create per-app databases
        run: npm run db:create

      - name: Generate Prisma clients
        run: |
          npm run generate --workspace=@workspace/db
          npm run generate --workspace=@workspace/db-identity
          npm run generate --workspace=@workspace/db-projects
          npm run generate --workspace=@workspace/db-calendars
          npm run generate --workspace=@workspace/db-files
          npm run generate --workspace=@workspace/db-messages
          npm run generate --workspace=@workspace/db-clients
          npm run generate --workspace=@workspace/db-employees
          npm run generate --workspace=@workspace/db-control-tower

      - name: Apply monolith migrations
        run: npx prisma migrate deploy
        working-directory: packages/db

      - name: Apply per-app migrations
        run: npm run migrate:deploy

      - name: Verify migration drift
        run: npm run verify:migrations

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/copilot

      - name: E2E + accessibility
        run: npm run test:e2e --workspace=copilot

  # The first domain app (#160): it signs in through Copilot, so the suite runs
  # both apps. The job provisions the first-party OAuth client itself
  # (`apps/projects/e2e/bootstrap.ts`) instead of requiring an admin session.
  e2e-projects:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: asynchrone
          POSTGRES_PASSWORD: asynchrone
          POSTGRES_DB: asynchrone
        ports:
