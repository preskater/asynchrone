name: Helm CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Build chart dependencies
        run: helm dependency build charts/asynchrone-space

      # The generic app chart archive is committed so Git-based chart sources
      # (Rancher, Fleet) and packaged charts work without `helm dependency
      # build`. Compare contents with the source instead of raw bytes: Helm
      # embeds checkout mtimes in the tar headers and re-serializes Chart.yaml,
      # so a rebuild never produces an identical file. Metadata is compared
      # through `helm show chart`, which normalizes it.
      - name: Check the vendored app chart is up to date
        shell: bash
        run: |
          set -euo pipefail
          set -- charts/asynchrone-space/charts/asynchrone-space-app-*.tgz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "Expected exactly one vendored archive for asynchrone-space-app" >&2
            exit 1
          fi
          archive="$1"
          tmp="$(mktemp -d)"
          tar -xzf "$archive" -C "$tmp"
          diff <(helm show chart charts/asynchrone-space-app) <(helm show chart "$archive")
          diff -r --exclude=.helmignore --exclude=Chart.yaml \
            charts/asynchrone-space-app "${tmp}/asynchrone-space-app"
          rm -rf "$tmp"

      # Lints the umbrella, renders it, renders every app alias on its own and
      # renders the generic chart standalone. It also asserts the wildcard
      # certificates, the www redirect, the Copilot discovery URLs and the
      # single-owner CronJob set.
      - name: Lint and render every app
        run: node scripts/verify-helm-charts.mjs
